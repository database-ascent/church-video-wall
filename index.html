<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vizio Wall Cast Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    .slide-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      background-repeat: no-repeat;
      opacity: 0;
      will-change: opacity, background-position, background-size;
      image-rendering: high-quality;
      z-index: 2;
    }

    body.mode-tile .slide-layer {
      background-size: contain !important;
      background-position: center center !important;
    }

    #status-overlay {
      position: fixed; top: 15px; left: 15px;
      color: #00ff66; font-family: monospace; font-size: 14px;
      background: rgba(0,0,0,0.8); padding: 8px 14px;
      border-radius: 6px; z-index: 100;
      transition: opacity 0.8s ease-out;
      pointer-events: none;
    }
  </style>
</head>
<body class="mode-span" data-screen="1">
  <div id="status-overlay">Waiting for Controller...</div>
  <div id="slide-a" class="slide-layer"></div>
  <div id="slide-b" class="slide-layer"></div>

  <script>
    const statusEl = document.getElementById('status-overlay');
    const layers = [
      document.getElementById('slide-a'),
      document.getElementById('slide-b')
    ];
    
    let screenIndex = 1;
    let ws = null;
    let serverHost = "";
    let currentBezel = 1.0;
    let currentLayout = 'span';
    let currentLayerIndex = 0;
    let scheduledTransitionTimer = null;
    const imageCache = new Map();

    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_CHANNEL = 'urn:x-cast:com.church.videowall';

    context.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
      let data = event.data;
      if (typeof data === 'string') {
        try { data = JSON.parse(data); } catch(e) {}
      }
      if (!data) return;

      screenIndex = parseInt(data.screen || 1, 10);
      serverHost = data.serverIp || "";
      currentBezel = parseFloat(data.bezel !== undefined ? data.bezel : 1.0);
      
      document.body.setAttribute('data-screen', screenIndex);
      statusEl.textContent = `Screen ${screenIndex} Ready`;
      
      applyBezelGeometry(currentBezel);
      if (serverHost) {
        connectToLocalMac(serverHost);
      }
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.maxInactivity = 86400;
    options.skipPlayersLoad = true;
    context.start(options);

    function hideStatusOverlay() {
      statusEl.style.opacity = '0';
      setTimeout(() => { statusEl.style.display = 'none'; }, 800);
    }

    function applyBezelGeometry(bezel) {
      currentBezel = parseFloat(bezel !== undefined ? bezel : 1.0);
      if (currentLayout !== 'span') {
        layers.forEach(layer => {
          layer.style.backgroundSize = 'contain';
          layer.style.backgroundPosition = 'center center';
        });
        return;
      }

      const b = currentBezel;
      layers.forEach(layer => {
        if (screenIndex === 1) {
          layer.style.backgroundSize = `calc(100% + ${b}vw) 100%`;
          layer.style.backgroundPosition = '0% center';
        } else if (screenIndex === 2) {
          layer.style.backgroundSize = `calc(100% + ${2 * b}vw) 100%`;
          layer.style.backgroundPosition = 'center center';
        } else if (screenIndex === 3) {
          layer.style.backgroundSize = `calc(100% + ${b}vw) 100%`;
          layer.style.backgroundPosition = '100% center';
        }
      });
    }

    function preloadImage(url) {
      if (imageCache.has(url)) return imageCache.get(url);
      if (imageCache.size >= 8) {
        const oldestKey = imageCache.keys().next().value;
        imageCache.delete(oldestKey);
      }
      const img = new Image();
      img.src = url;
      if (img.decode) img.decode().catch(() => {});
      imageCache.set(url, img);
      return img;
    }

    function connectToLocalMac(host) {
      if (!host) return;
      serverHost = host;

      if (ws) {
        try { ws.close(); } catch(e) {}
      }

      ws = new WebSocket(`ws://${host}`);

      ws.onopen = () => {
        statusEl.textContent = `Screen ${screenIndex} Ready`;
        setTimeout(hideStatusOverlay, 2000);
      };

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        if (msg.type === 'bezel-config') {
          applyBezelGeometry(msg.bezel);
          return;
        }

        if (msg.type === 'kill-cast') {
          statusEl.style.display = 'block';
          statusEl.style.opacity = '1';
          statusEl.textContent = "Closing Cast...";
          setTimeout(() => { context.stop(); }, 500);
          return;
        }

        // LOOKAHEAD PRELOAD: Silently downloads the next upcoming slide in RAM
        if (msg.type === 'preload-next' && msg.slideUrl) {
          const base = msg.slideUrl.slice(0, msg.slideUrl.lastIndexOf('.'));
          const nextUrl = currentLayout === 'span' 
            ? `http://${host}${base}_screen${screenIndex}.jpg` 
            : `http://${host}${msg.slideUrl}`;
          preloadImage(nextUrl);
          return;
        }

        // --- SYNCHRONIZED SCHEDULED TRANSITION ---
        if (msg.type === 'show-slide') {
          hideStatusOverlay();
          currentLayout = msg.layout || 'span';
          document.body.className = (currentLayout === 'tile') ? 'mode-tile' : 'mode-span';
          applyBezelGeometry(currentBezel);

          let targetUrl = "";
          if (currentLayout === 'span') {
            const base = msg.slideUrl.slice(0, msg.slideUrl.lastIndexOf('.'));
            targetUrl = `http://${host}${base}_screen${screenIndex}.jpg`;
          } else {
            targetUrl = `http://${host}${msg.slideUrl}`;
          }

          const fadeDuration = parseFloat(msg.fadeDuration !== undefined ? msg.fadeDuration : 1.0);
          
          // Pre-decode into memory immediately during the pre-roll window
          const imgObj = preloadImage(targetUrl);
          if (imgObj.decode) {
            try { await imgObj.decode(); } catch(e) {}
          }

          const incomingIndex = 1 - currentLayerIndex;
          const incoming = layers[incomingIndex];
          const outgoing = layers[currentLayerIndex];

          // 1. Prepare incoming layer at 0 opacity
          incoming.style.transition = 'none';
          incoming.style.opacity = '0';
          incoming.style.backgroundImage = `url('${targetUrl}')`;
          incoming.style.zIndex = '3';
          outgoing.style.zIndex = '2';

          void incoming.offsetWidth; // Force layout paint

          // 2. Schedule exact execution millisecond (absorbs Wi-Fi jitter)
          const targetEpoch = msg.targetTime || Date.now();
          const delay = Math.max(0, targetEpoch - Date.now());

          if (scheduledTransitionTimer) clearTimeout(scheduledTransitionTimer);

          scheduledTransitionTimer = setTimeout(() => {
            const transitionCss = `opacity ${fadeDuration}s cubic-bezier(0.4, 0.0, 0.2, 1)`;
            incoming.style.transition = transitionCss;
            outgoing.style.transition = transitionCss;

            incoming.style.opacity = '1';
            outgoing.style.opacity = '0';

            currentLayerIndex = incomingIndex;
          }, delay);
        }

        if (msg.type === 'blackout') {
          if (scheduledTransitionTimer) clearTimeout(scheduledTransitionTimer);
          layers[0].style.opacity = '0';
          layers[1].style.opacity = '0';
        }
      };
    }
  </script>
</body>
</html>
