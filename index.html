<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vizio Wall Cast Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      background: #000;
      overflow: hidden;
    }
    
    /* Dual 4K Hardware Video Planes */
    .video-layer {
      position: absolute; top: 0; left: 0;
      width: 100vw; height: 100vh;
      object-fit: cover;
      opacity: 0;
      will-change: opacity;
      z-index: 2;
    }

    #status-overlay {
      position: fixed; top: 15px; left: 15px;
      color: #00ff66; font-family: monospace; font-size: 14px;
      background: rgba(0,0,0,0.8); padding: 8px 14px;
      border-radius: 6px; z-index: 100;
      transition: opacity 0.8s ease-out;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status-overlay">Waiting for Controller...</div>
  <!-- Dual 4K Hardware Video Decoders for Seamless Crossfade -->
  <video id="video-a" class="video-layer" preload="auto" muted playsinline loop></video>
  <video id="video-b" class="video-layer" preload="auto" muted playsinline loop></video>

  <script>
    const statusEl = document.getElementById('status-overlay');
    const videoLayers = [
      document.getElementById('video-a'),
      document.getElementById('video-b')
    ];
    
    let screenIndex = 1;
    let ws = null;
    let serverHost = "";
    let currentLayerIndex = 0; // Alternates between video-a (0) and video-b (1)

    const context = cast.framework.CastReceiverContext.getInstance();
    const CUSTOM_CHANNEL = 'urn:x-cast:com.church.videowall';

    context.addCustomMessageListener(CUSTOM_CHANNEL, (event) => {
      screenIndex = event.data.screen;
      serverHost = event.data.serverIp;
      
      statusEl.textContent = `Screen ${screenIndex} Ready (4K Hardware Direct)`;
      connectToLocalMac(serverHost);
    });

    const options = new cast.framework.CastReceiverOptions();
    options.disableIdleTimeout = true;
    options.maxInactivity = 86400;
    options.skipPlayersLoad = true;
    context.start(options);

    function hideStatusOverlay() {
      statusEl.style.opacity = '0';
      setTimeout(() => { statusEl.style.display = 'none'; }, 800);
    }

    function connectToLocalMac(host) {
      ws = new WebSocket(`ws://${host}`);

      ws.onmessage = async (event) => {
        const msg = JSON.parse(event.data);

        // --- KILL CAST ---
        if (msg.type === 'kill-cast') {
          statusEl.style.display = 'block';
          statusEl.style.opacity = '1';
          statusEl.textContent = "Closing Cast...";
          setTimeout(() => { context.stop(); }, 500);
          return;
        }

        // --- SHOW 4K HARDWARE VIDEO SLIDE ---
        if (msg.type === 'show-slide') {
          hideStatusOverlay();

          // Construct native 4K MP4 stream URL for this TV
          const base = msg.slideUrl.slice(0, msg.slideUrl.lastIndexOf('.'));
          const target4KVideoUrl = `http://${host}${base}_screen${screenIndex}.mp4`;
          const fadeDuration = parseFloat(msg.fadeDuration !== undefined ? msg.fadeDuration : 1.0);

          const incomingIndex = 1 - currentLayerIndex;
          const incomingVideo = videoLayers[incomingIndex];
          const outgoingVideo = videoLayers[currentLayerIndex];

          // 1. Prepare incoming 4K video player
          incomingVideo.style.transition = 'none';
          incomingVideo.style.opacity = '0';
          incomingVideo.src = target4KVideoUrl;
          incomingVideo.style.zIndex = '3';
          outgoingVideo.style.zIndex = '2';

          incomingVideo.load();
          incomingVideo.play().then(() => {
            void incomingVideo.offsetWidth; // Force layout flush

            // 2. Crossfade between hardware 4K video decoders
            const transitionCss = `opacity ${fadeDuration}s cubic-bezier(0.4, 0.0, 0.2, 1)`;
            incomingVideo.style.transition = transitionCss;
            outgoingVideo.style.transition = transitionCss;

            incomingVideo.style.opacity = '1';
            outgoingVideo.style.opacity = '0';

            currentLayerIndex = incomingIndex;

            // Pause outgoing video once fade completes
            setTimeout(() => {
              outgoingVideo.pause();
            }, (fadeDuration * 1000) + 100);
          }).catch(e => {
            console.error("4K Video play error", e);
          });
        }

        // --- PLAY VIDEO WALL LOOP ---
        if (msg.type === 'play-video') {
          hideStatusOverlay();
          const targetUrl = `http://${host}/screen${screenIndex}.mp4`;
          const activeVideo = videoLayers[currentLayerIndex];
          
          activeVideo.src = targetUrl;
          activeVideo.style.opacity = '1';
          activeVideo.play();
        }

        // --- BLACKOUT ---
        if (msg.type === 'blackout') {
          videoLayers[0].style.opacity = '0';
          videoLayers[1].style.opacity = '0';
          videoLayers[0].pause();
          videoLayers[1].pause();
        }
      };
    }
  </script>
</body>
</html>
